# Scanner background worker only. Does not manage the existing blackout.network web service.
# Apply as its own Blueprint (path: render.scanner.yaml) with existingResources: create_new.
# Cost: 1c-2g compute $25/month + 1 GB SSD $0.25/month. No Pro upgrade. No other resources.
services:
  - type: worker
    name: blackout-scanner
    runtime: docker
    plan: 1c-2g
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    autoDeployTrigger: commit
    disk:
      name: scanner-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: X_READS_OFF
        value: "1"
      - key: NEWSLETTER_NO_WORKER
        value: "1"
      - key: BN_NO_STREAMWATCH
        value: "1"
      - key: BN_NO_SNAPSHOTS
        value: "1"
      - key: BN_WORKER_DATA
        value: "/data"
      - key: BN_WORKER_INTERVAL_MINUTES
        value: "9"
      - key: BN_RENDER_URL
        value: "https://blackout.network"
      - key: BN_SYNC_SECRET
        sync: false
