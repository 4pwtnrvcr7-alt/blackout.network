@font-face{font-family:Inter;src:url(/fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#0B0D10;--panel:#14181D;--line:#252B33;--tx:#E6E9EE;--mu:#9AA4B2;--y:#FFC21A;--red:#C8102E}
@media (prefers-color-scheme:light){:root{--bg:#F6F7F9;--panel:#FFFFFF;--line:#DDE1E6;--tx:#0B0D10;--mu:#4A5361;--y:#C97B00}.logo path[fill="#FFFFFF"]{fill:#0B0D10}.logo path[fill="#FFC21A"]{fill:#C97B00}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.logo{height:18px;width:auto;display:block}
.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.rank{background:var(--y);border-color:var(--y);color:#0B0D10}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
h1{font-size:24px;line-height:1.25;margin:6px 0 14px;font-weight:800;letter-spacing:-.01em}
.conf{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--y);border-radius:10px;background:var(--panel);margin:0 0 16px;font-size:15px}
.conf b{color:var(--y)}
p.brief{margin:0 0 20px;font-size:16px}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:22px 0 8px;font-weight:700}
ul.links{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
ul.links li+li{border-top:1px solid var(--line)}
ul.links a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;color:var(--tx);text-decoration:none;min-height:48px}
ul.links a span.s{font-weight:600}ul.links a span.h{display:block;font-size:12px;color:var(--mu);font-weight:400;word-break:break-all}
ul.links svg,.btn svg{flex:none;width:18px;height:18px;color:var(--y)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 0;padding:14px;border-radius:10px;border:1px solid var(--y);color:var(--y);text-decoration:none;font-weight:700;min-height:48px}
.note{font-size:13px;color:var(--mu);margin-top:18px}
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--mu);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.err{padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-top:22px}
[hidden]{display:none!important}
</style></head>
